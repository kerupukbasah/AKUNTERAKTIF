<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKUNTERAKTIF - Media Pembelajaran Akuntansi</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom Scrollbar for better UI */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    
    /* Animations */
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-pulse-fast { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased overflow-hidden">
  
  <!-- App Container -->
  <div id="root" class="h-screen w-screen flex flex-col md:flex-row"></div>
  
  <!-- Toasts Container -->
  <div id="toasts" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  <!-- AI Chatbox Global Container -->
  <div id="chatbox-root"></div>

  <script>
    // --- 1. DATA & CONSTANTS ---
    const CHART_OF_ACCOUNTS = [
      { code: '111', name: 'Kas', normal: 'debit', category: 'Aset' },
      { code: '112', name: 'Piutang Usaha', normal: 'debit', category: 'Aset' },
      { code: '113', name: 'Perlengkapan', normal: 'debit', category: 'Aset' },
      { code: '114', name: 'Sewa Dibayar di Muka', normal: 'debit', category: 'Aset' },
      { code: '121', name: 'Peralatan', normal: 'debit', category: 'Aset Tetap' },
      { code: '122', name: 'Akumulasi Penyusutan Peralatan', normal: 'kredit', category: 'Aset Tetap' },
      { code: '211', name: 'Utang Usaha', normal: 'kredit', category: 'Liabilitas' },
      { code: '212', name: 'Utang Gaji', normal: 'kredit', category: 'Liabilitas' },
      { code: '221', name: 'Utang Bank', normal: 'kredit', category: 'Liabilitas' },
      { code: '311', name: 'Modal', normal: 'kredit', category: 'Ekuitas' },
      { code: '312', name: 'Prive', normal: 'debit', category: 'Ekuitas' },
      { code: '411', name: 'Pendapatan Jasa', normal: 'kredit', category: 'Pendapatan' },
      { code: '511', name: 'Beban Gaji', normal: 'debit', category: 'Beban' },
      { code: '512', name: 'Beban Sewa', normal: 'debit', category: 'Beban' },
      { code: '513', name: 'Beban Perlengkapan', normal: 'debit', category: 'Beban' },
      { code: '514', name: 'Beban Penyusutan', normal: 'debit', category: 'Beban' },
      { code: '515', name: 'Beban Lain-lain', normal: 'debit', category: 'Beban' }
    ];

    const MATERI_LIST = [
      { id: 1, title: 'Pengantar Akuntansi', content: 'Akuntansi adalah proses mengidentifikasi, mengukur, dan melaporkan informasi ekonomi untuk memungkinkan adanya penilaian dan keputusan yang jelas dan tegas bagi mereka yang menggunakan informasi tersebut. Fungsi utamanya adalah menyajikan informasi keuangan kepada pihak internal (manajemen) dan eksternal (investor, pemerintah).' },
      { id: 2, title: 'Konsep Dasar & Persamaan Akuntansi', content: 'Persamaan Dasar Akuntansi adalah Harta (Aset) = Utang (Liabilitas) + Modal (Ekuitas). Setiap transaksi akan selalu menjaga keseimbangan persamaan ini. Saldo normal akun menentukan di sisi mana (debit/kredit) akun tersebut bertambah.' },
      { id: 3, title: 'Analisis & Bukti Transaksi', content: 'Setiap transaksi keuangan harus didukung oleh bukti transaksi (kuitansi, faktur, nota). Analisis transaksi bertujuan menentukan akun apa yang terpengaruh, apakah bertambah atau berkurang, dan di sisi mana (debit/kredit) harus dicatat.' },
      { id: 4, title: 'Jurnal Umum', content: 'Jurnal umum adalah buku catatan pertama untuk mencatat transaksi keuangan secara kronologis. Formatnya terdiri dari Tanggal, Keterangan (Nama Akun), Referensi, Debit, dan Kredit. Total Debit harus selalu sama dengan total Kredit.' },
      { id: 5, title: 'Buku Besar & Neraca Saldo', content: 'Buku Besar adalah kumpulan akun yang saling berhubungan. Proses memindahkan catatan dari jurnal ke buku besar disebut posting. Neraca Saldo dibuat di akhir periode untuk menguji keseimbangan debit dan kredit dari seluruh saldo buku besar.' },
      { id: 6, title: 'Jurnal Penyesuaian', content: 'Dibuat pada akhir periode akuntansi untuk menyesuaikan saldo-saldo akun agar menunjukkan keadaan yang sebenarnya (basis akrual). Contohnya: penyesuaian perlengkapan terpakai, beban dibayar di muka, dan penyusutan aset.' },
      { id: 7, title: 'Neraca Lajur', content: 'Kertas kerja (worksheet) berkolom-kolom yang digunakan untuk memudahkan penyusunan laporan keuangan. Terdiri dari kolom neraca saldo, penyesuaian, neraca saldo disesuaikan, laba/rugi, dan neraca.' },
      { id: 8, title: 'Laporan Keuangan', content: 'Terdiri dari: 1. Laporan Laba Rugi (Pendapatan - Beban). 2. Laporan Perubahan Modal (Modal Awal + Laba - Prive). 3. Laporan Posisi Keuangan / Neraca (Daftar Aset, Liabilitas, Ekuitas pada tanggal tertentu).' },
      { id: 9, title: 'Jurnal Penutup', content: 'Digunakan untuk menolkan saldo akun-akun nominal (pendapatan dan beban) serta prive pada akhir periode, dengan memindahkannya ke akun Ikhtisar Laba/Rugi, lalu ke akun Modal.' },
      { id: 10, title: 'Jurnal Pembalik', content: 'Jurnal opsional yang dibuat pada awal periode akuntansi berikutnya untuk membalik jurnal penyesuaian tertentu (misal: beban yang masih harus dibayar) agar pencatatan transaksi rutin lebih konsisten.' },
      { id: 11, title: 'Siklus Akuntansi Jasa', content: 'Siklus lengkap perusahaan jasa meliputi: Bukti Transaksi -> Jurnal Umum -> Buku Besar -> Neraca Saldo -> Jurnal Penyesuaian -> Kertas Kerja -> Laporan Keuangan -> Jurnal Penutup -> Neraca Saldo Setelah Penutupan.' },
      { id: 12, title: 'Etika Profesi Akuntansi', content: 'Akuntan harus mematuhi kode etik: integritas, objektivitas, kompetensi profesional dan kehati-hatian, kerahasiaan, serta perilaku profesional. Hal ini penting untuk menjaga kepercayaan publik terhadap informasi keuangan.' }
    ];

    const GLOSARIUM = [
      { term: 'Aset', desc: 'Sumber daya ekonomi yang dikuasai perusahaan.' },
      { term: 'Liabilitas', desc: 'Kewajiban perusahaan kepada pihak luar (Utang).' },
      { term: 'Ekuitas', desc: 'Hak pemilik atas aset perusahaan setelah dikurangi liabilitas.' },
      { term: 'Debit', desc: 'Sisi kiri dari sebuah akun.' },
      { term: 'Kredit', desc: 'Sisi kanan dari sebuah akun.' },
      { term: 'Posting', desc: 'Proses memindahkan catatan dari jurnal ke buku besar.' },
      { term: 'Prive', desc: 'Pengambilan aset perusahaan oleh pemilik untuk keperluan pribadi.' },
      { term: 'Akrual', desc: 'Pencatatan transaksi saat terjadi, bukan saat kas diterima/dibayar.' }
    ];

    const BADGES = [
      { id: 'b1', name: 'Pemula', desc: 'Memulai perjalanan belajar', threshold: 10 },
      { id: 'b2', name: 'Rajin', desc: 'Mendapat 100 poin', threshold: 100 },
      { id: 'b3', name: 'Sarjana', desc: 'Mendapat 500 poin', threshold: 500 },
      { id: 'b4', name: 'Ahli Jurnal', desc: 'Mencoba simulasi Lab', threshold: 50 }
    ];

    const EVALUASI_QS = [
      { q: "Apakah tujuan utama dari akuntansi?", options: ["Mencari kesalahan karyawan", "Menyajikan informasi keuangan kepada pihak yang berkepentingan", "Menghitung jumlah barang di gudang", "Mencatat daftar hadir pegawai"], ans: 1 },
      { q: "Rumus Persamaan Dasar Akuntansi yang benar adalah...", options: ["Aset = Liabilitas - Ekuitas", "Ekuitas = Aset + Liabilitas", "Aset = Liabilitas + Ekuitas", "Liabilitas = Aset + Ekuitas"], ans: 2 },
      { q: "Proses memindahkan catatan transaksi dari Jurnal Umum ke Buku Besar disebut dengan...", options: ["Penjurnalan", "Pengikhtisaran", "Posting", "Pelaporan"], ans: 2 },
      { q: "Manakah dari akun di bawah ini yang saldo normalnya selalu berada di sisi Debit?", options: ["Utang Usaha", "Pendapatan Jasa", "Modal", "Beban Sewa"], ans: 3 },
      { q: "Jurnal yang dibuat pada akhir periode untuk menyesuaikan saldo akun agar menunjukkan keadaan sebenarnya disebut...", options: ["Jurnal Umum", "Jurnal Penutup", "Jurnal Penyesuaian", "Jurnal Pembalik"], ans: 2 },
      { q: "Laporan yang secara khusus menyajikan jumlah Harta, Utang, dan Modal perusahaan pada tanggal tertentu adalah...", options: ["Laporan Laba Rugi", "Laporan Perubahan Modal", "Laporan Arus Kas", "Laporan Posisi Keuangan (Neraca)"], ans: 3 },
      { q: "Kelompok akun apa saja yang sifatnya nominal dan perlu ditutup menggunakan Jurnal Penutup di akhir periode?", options: ["Aset dan Liabilitas", "Pendapatan, Beban, dan Prive", "Modal dan Aset", "Liabilitas dan Modal"], ans: 1 },
      { q: "Apabila terjadi transaksi penerimaan uang tunai dari pelanggan, bukti transaksi yang paling tepat diberikan adalah...", options: ["Faktur", "Nota Debit", "Kuitansi", "Nota Kredit"], ans: 2 },
      { q: "Jika perusahaan membeli peralatan baru secara kredit, maka pencatatan jurnal umumnya adalah...", options: ["Peralatan (Debit), Kas (Kredit)", "Kas (Debit), Utang (Kredit)", "Peralatan (Debit), Utang Usaha (Kredit)", "Utang Usaha (Debit), Peralatan (Kredit)"], ans: 2 },
      { q: "Urutan siklus akuntansi perusahaan jasa yang paling tepat di bawah ini adalah...", options: ["Jurnal -> Bukti Transaksi -> Buku Besar -> Laporan Keuangan", "Bukti Transaksi -> Jurnal -> Buku Besar -> Neraca Saldo -> Laporan Keuangan", "Buku Besar -> Jurnal -> Neraca Saldo -> Laporan Keuangan", "Laporan Keuangan -> Neraca Saldo -> Jurnal -> Buku Besar"], ans: 1 }
    ];

    const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);

    // --- 2. STATE MANAGEMENT ---
    let state = {
      user: JSON.parse(localStorage.getItem('akunteraktif_user')) || null,
      points: Number(localStorage.getItem('akunteraktif_points')) || 0,
      progress: JSON.parse(localStorage.getItem('akunteraktif_progress')) || { materi: [], labStep: 1 },
      labData: JSON.parse(localStorage.getItem('akunteraktif_lab_journal')) || [],
      forum: JSON.parse(localStorage.getItem('akunteraktif_forum')) || [],
      calendar: JSON.parse(localStorage.getItem('akunteraktif_calendar')) || [],
      
      currentView: 'dashboard',
      mobileMenuOpen: false,
      
      // Local view states
      activeMateriId: 1,
      labTab: 'info',
      calcTab: 'pda',
      glosariumSearch: '',
      
      // Games & Evaluasi states
      eval: { step: 0, score: 0, finished: false, selected: null, feedback: null },
      games: {
        tebakAkun: { step: 0, score: 0, feedback: null },
        pasangDK: { step: 0, score: 0, db: '', kr: '', feedback: null },
        susunJurnal: { step: 0, score: 0, selected: [], feedback: null },
        klasifikasi: { score: 0, current: null },
        saldoNormal: { qIndex: 0, score: 0, questions: [], feedback: null },
        tantangan: { playing: false, timeLeft: 30, score: 0, currentQ: null, intervalId: null }
      }
    };

    function saveState(key, value) {
      localStorage.setItem(`akunteraktif_${key}`, JSON.stringify(value));
    }

    // --- 3. UI HELPER COMPONENTS (String Builders) ---
    const UI = {
      Button: (text, onclick, variant = 'primary', extraClass = '', disabled = false) => {
        const base = "inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
        const variants = {
          primary: "bg-indigo-600 text-white hover:bg-indigo-700",
          secondary: "bg-slate-100 text-slate-700 hover:bg-slate-200",
          danger: "bg-red-600 text-white hover:bg-red-700",
          outline: "border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50",
          ghost: "text-slate-600 hover:bg-slate-100"
        };
        return `<button onclick="${onclick}" class="${base} ${variants[variant]} ${extraClass}" ${disabled ? 'disabled' : ''}>${text}</button>`;
      },
      Card: (title, icon, content, extraClass = '') => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden ${extraClass}">
          ${title ? `<div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50"><div class="flex items-center gap-2 text-slate-800 font-semibold"><i class="${icon} text-indigo-600"></i> ${title}</div></div>` : ''}
          <div class="p-5">${content}</div>
        </div>
      `,
      NavItem: (id, label, icon) => {
        const isActive = state.currentView === id;
        return `<button onclick="app.navigate('${id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${isActive ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}">
          <i class="${icon} ${isActive ? 'text-indigo-600' : 'text-slate-400'} w-5 text-center"></i> ${label}
        </button>`;
      }
    };

    // --- 4. MAIN APP CONTROLLER ---
    window.app = {
      init() {
        this.render();
      },
      
      toast(message, type = 'success') {
        const container = document.getElementById('toasts');
        const el = document.createElement('div');
        el.className = `px-4 py-3 rounded shadow-lg text-white font-medium flex items-center gap-2 transform transition-all duration-300 animate-slide-up pointer-events-auto ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
        el.innerHTML = `<i class="${type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'}"></i> ${message}`;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, 3000);
      },

      addPoints(amount, reason) {
        state.points += amount;
        saveState('points', state.points);
        this.toast(`+${amount} Poin: ${reason}`, 'success');
        this.renderContent(); // Soft render
      },

      login(role) {
        const name = document.getElementById('login-name').value;
        if (!name.trim()) return this.toast("Silakan masukkan nama Anda.", "error");
        state.user = { name, role, avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}` };
        saveState('user', state.user);
        this.toast(`Selamat datang, ${name}!`, 'success');
        this.render();
      },

      logout() {
        state.user = null;
        localStorage.removeItem('akunteraktif_user');
        this.toast("Berhasil keluar sesi.", "success");
        this.render();
      },

      resetAll() {
        if (confirm("Apakah Anda yakin ingin menghapus SEMUA data dan kembali ke awal?")) {
          localStorage.clear();
          window.location.reload();
        }
      },

      navigate(view) {
        // Cleanup global intervals
        if(state.games.tantangan.intervalId) {
          clearInterval(state.games.tantangan.intervalId);
          state.games.tantangan.intervalId = null;
        }
        
        state.currentView = view;
        state.mobileMenuOpen = false;
        
        // Reset local view states
        this.resetGameStates();
        
        this.render(); // Hard render for layout updates
      },

      toggleMobileMenu() {
        state.mobileMenuOpen = !state.mobileMenuOpen;
        this.render();
      },

      resetGameStates() {
        state.eval = { step: 0, score: 0, finished: false, selected: null, feedback: null };
        state.games.tebakAkun = { step: 0, score: 0, feedback: null };
        state.games.pasangDK = { step: 0, score: 0, db: '', kr: '', feedback: null };
        state.games.susunJurnal = { step: 0, score: 0, selected: [], feedback: null };
        state.games.klasifikasi = { score: 0, current: CHART_OF_ACCOUNTS[Math.floor(Math.random() * CHART_OF_ACCOUNTS.length)] };
        state.games.saldoNormal = { qIndex: 0, score: 0, questions: [...CHART_OF_ACCOUNTS].sort(() => 0.5 - Math.random()).slice(0, 10), feedback: null };
        state.games.tantangan = { playing: false, timeLeft: 30, score: 0, currentQ: null, intervalId: null };
      },

      // --- RENDERING PIPELINE ---
      render() {
        const root = document.getElementById('root');
        if (!state.user) {
          root.innerHTML = this.views.landing();
          document.getElementById('chatbox-root').innerHTML = ''; // Hide AI when logged out
          return;
        }
        root.innerHTML = this.views.layout();
        this.renderContent();
        this.renderChatbox();
      },

      renderContent() {
        const contentDiv = document.getElementById('main-content');
        if(!contentDiv) return;
        
        const renderMap = {
          'dashboard': this.views.dashboard,
          'materi': this.views.materi,
          'lab': this.views.lab,
          'calc': this.views.calc,
          'evaluasi': this.views.evaluasi,
          'glosarium': this.views.glosarium,
          'forum': this.views.forum,
          'calendar': this.views.calendar,
          'settings': this.views.settings,
          'creator': this.views.creator,
          'game_tebak_akun': this.views.gameTebakAkun,
          'game_pasang_dk': this.views.gamePasangDK,
          'game_susun_jurnal': this.views.gameSusunJurnal,
          'game_klasifikasi': this.views.gameKlasifikasi,
          'game_saldo': this.views.gameSaldoNormal,
          'game_tantangan': this.views.gameTantangan
        };

        const viewFn = renderMap[state.currentView];
        contentDiv.innerHTML = viewFn ? viewFn.call(this) : '<div>View tidak ditemukan.</div>';
      },

      // --- VIEWS ---
      views: {
        landing: () => `
          <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 w-full">
            <div class="max-w-md w-full">
              <div class="text-center mb-8">
                <div class="bg-indigo-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg rotate-3">
                  <i class="fas fa-book-open text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">AKUNTERAKTIF</h1>
                <p class="text-slate-600 mt-2">Belajar Akuntansi Lebih Mudah, Interaktif, dan Menyenangkan.</p>
              </div>
              ${UI.Card('', '', `
                <div class="space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Panggilan</label>
                    <input type="text" id="login-name" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Masukkan nama Anda..." onkeydown="if(event.key==='Enter') app.login('murid')"/>
                  </div>
                  <div class="pt-2">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Masuk Sebagai:</label>
                    <div class="grid grid-cols-2 gap-3">
                      <button onclick="app.login('murid')" class="border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 h-auto py-4 rounded-lg font-medium flex flex-col items-center gap-2 transition"><i class="fas fa-user text-2xl"></i> Murid</button>
                      <button onclick="app.login('guru')" class="border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 h-auto py-4 rounded-lg font-medium flex flex-col items-center gap-2 transition"><i class="fas fa-chalkboard-teacher text-2xl"></i> Guru</button>
                    </div>
                  </div>
                </div>
              `, 'shadow-xl')}
            </div>
          </div>
        `,
        
        layout: () => `
          <!-- Mobile Header -->
          <div class="md:hidden bg-white p-4 flex justify-between items-center border-b border-slate-200 z-20 w-full shrink-0">
            <div class="font-bold text-indigo-700 text-lg flex items-center gap-2"><i class="fas fa-book-open"></i> AKUNTERAKTIF</div>
            <button onclick="app.toggleMobileMenu()" class="p-2 bg-slate-50 rounded text-slate-600"><i class="fas ${state.mobileMenuOpen ? 'fa-times' : 'fa-bars'} text-xl"></i></button>
          </div>

          <!-- Sidebar -->
          <div class="fixed md:static inset-0 bg-white md:w-64 border-r border-slate-200 flex flex-col transform transition-transform duration-300 z-10 shrink-0 ${state.mobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}">
            <div class="p-6 hidden md:block border-b border-slate-100">
              <div class="font-bold text-indigo-700 text-xl flex items-center gap-2"><i class="fas fa-book-open"></i> AKUNTERAKTIF</div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-1 mt-16 md:mt-0">
              <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-2 mt-4">Utama</div>
              ${UI.NavItem('dashboard', 'Dashboard', 'fa-home')}
              ${UI.NavItem('materi', 'Materi Belajar', 'fa-bookmark')}
              ${UI.NavItem('lab', 'Lab Akuntansi', 'fa-chart-line')}
              ${UI.NavItem('calc', 'Kalkulator', 'fa-calculator')}
              
              <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-2 mt-6">Latihan & Interaksi</div>
              ${UI.NavItem('evaluasi', 'Evaluasi Akhir', 'fa-check-circle')}
              ${UI.NavItem('glosarium', 'Glosarium', 'fa-file-alt')}
              ${UI.NavItem('forum', 'Forum Diskusi', 'fa-comments')}
              ${UI.NavItem('calendar', 'Kalender', 'fa-calendar-alt')}
              
              <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-2 mt-6">Permainan Edukatif</div>
              ${UI.NavItem('game_tebak_akun', 'Tebak Nama Akun', 'fa-question-circle')}
              ${UI.NavItem('game_pasang_dk', 'Pasang Debit/Kredit', 'fa-gamepad')}
              ${UI.NavItem('game_susun_jurnal', 'Susun Jurnal', 'fa-file-alt')}
              ${UI.NavItem('game_klasifikasi', 'Klasifikasi Akun', 'fa-brain')}
              ${UI.NavItem('game_saldo', 'Tebak Saldo Normal', 'fa-chart-pie')}
              ${UI.NavItem('game_tantangan', 'Tantangan 30 Detik', 'fa-stopwatch')}

              <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-2 mt-6">Akun & Bantuan</div>
              ${UI.NavItem('settings', 'Pengaturan', 'fa-cog')}
              ${UI.NavItem('creator', 'Profil Pembuat', 'fa-user')}

        state.calendar.push({ id: Date.now(), task, date, done: false });
        state.calendar.sort((a,b)=>new Date(a.date)-new Date(b.date));
        saveState('calendar', state.calendar); this.renderContent(); this.toast('Jadwal disimpan');
      },
      calToggle(id) { const c = state.calendar.find(x=>x.id===id); c.done=!c.done; saveState('calendar', state.calendar); this.renderContent(); },
      calDel(id) { state.calendar = state.calendar.filter(x=>x.id!==id); saveState('calendar', state.calendar); this.renderContent(); },

      // Games Logic
      gameTebakAkun_ans(code) {
        if(state.games.tebakAkun.feedback) return;
        const correct = "111,211,312,411,514".split(",")[state.games.tebakAkun.step] === code;
        if(correct) { state.games.tebakAkun.score += 10; state.games.tebakAkun.feedback = 'correct'; }
        else state.games.tebakAkun.feedback = 'wrong';
        this.renderContent();
        setTimeout(() => { state.games.tebakAkun.feedback=null; state.games.tebakAkun.step++; this.renderContent(); }, 1000);
      },
      gameTebakAkun_reset() { this.addPoints(state.games.tebakAkun.score, 'Tebak Akun'); state.games.tebakAkun={step:0,score:0,feedback:null}; this.renderContent(); },

      gamePasangDK_check() {
        const {step, db, kr} = state.games.pasangDK;
        const ans = [{d:"113",k:"111"},{d:"111",k:"411"},{d:"511",k:"111"}][step];
        if(db===ans.d && kr===ans.k) { state.games.pasangDK.score+=20; state.games.pasangDK.feedback='correct'; }
        else state.games.pasangDK.feedback='wrong';
        this.renderContent();
        setTimeout(() => { state.games.pasangDK.feedback=null; state.games.pasangDK.db=''; state.games.pasangDK.kr=''; state.games.pasangDK.step++; this.renderContent(); }, 1500);
      },
      gamePasangDK_reset() { this.addPoints(state.games.pasangDK.score, 'Pasang DK'); state.games.pasangDK={step:0,score:0,db:'',kr:'',feedback:null}; this.renderContent(); },

      gameSusun_toggle(key) {
        let sel = state.games.susunJurnal.selected;
        if(sel.includes(key)) sel = sel.filter(k=>k!==key);
        else if(sel.length < 2) sel.push(key);
        state.games.susunJurnal.selected = sel; this.renderContent();
      },
      gameSusun_check() {
        const {step, selected} = state.games.susunJurnal;
        const ans = [["Kas-Debit","Modal-Kredit"], ["Beban Sewa-Debit","Kas-Kredit"]][step];
        if(selected.includes(ans[0]) && selected.includes(ans[1])) { state.games.susunJurnal.score+=25; state.games.susunJurnal.feedback='correct'; }
        else state.games.susunJurnal.feedback='wrong';
        this.renderContent();
        setTimeout(() => { state.games.susunJurnal.feedback=null; state.games.susunJurnal.selected=[]; state.games.susunJurnal.step++; this.renderContent(); }, 1500);
      },
      gameSusun_reset() { this.addPoints(state.games.susunJurnal.score, 'Susun Jurnal'); state.games.susunJurnal={step:0,score:0,selected:[],feedback:null}; this.renderContent(); },

      gameKlasifikasi_ans(cat) {
        if(state.games.klasifikasi.current.category.includes(cat)) { state.games.klasifikasi.score+=5; this.addPoints(5, 'Klasifikasi'); }
        state.games.klasifikasi.current = CHART_OF_ACCOUNTS[Math.floor(Math.random() * CHART_OF_ACCOUNTS.length)];
        this.renderContent();
      },

      gameSaldo_ans(ans) {
        if(state.games.saldoNormal.feedback) return;
        const curr = state.games.saldoNormal.questions[state.games.saldoNormal.qIndex];
        if(curr.normal === ans) { state.games.saldoNormal.score+=10; state.games.saldoNormal.feedback='correct'; }
        else state.games.saldoNormal.feedback='wrong';
        this.renderContent();
        setTimeout(() => { state.games.saldoNormal.feedback=null; state.games.saldoNormal.qIndex++; this.renderContent(); }, 1000);
      },
      gameSaldo_reset() { this.addPoints(state.games.saldoNormal.score, 'Tebak Saldo'); state.games.saldoNormal={qIndex:0,score:0,questions:[...CHART_OF_ACCOUNTS].sort(()=>0.5-Math.random()).slice(0,10),feedback:null}; this.renderContent(); },

      gameTantangan_start() {
        if(state.games.tantangan.intervalId) clearInterval(state.games.tantangan.intervalId);
        state.games.tantangan = { playing: true, timeLeft: 30, score: 0, currentQ: null, intervalId: null };
        this.gameTantangan_next();
        state.games.tantangan.intervalId = setInterval(() => {
          if(state.games.tantangan.timeLeft > 0) { state.games.tantangan.timeLeft--; this.renderContent(); }
          else { clearInterval(state.games.tantangan.intervalId); state.games.tantangan.playing=false; if(state.games.tantangan.score>0) this.addPoints(state.games.tantangan.score, 'Tantangan 30d'); this.renderContent(); }
        }, 1000);
      },
      gameTantangan_next() {
        const acc = CHART_OF_ACCOUNTS[Math.floor(Math.random() * CHART_OF_ACCOUNTS.length)];
        const isTrue = Math.random() > 0.5;
        state.games.tantangan.currentQ = { name: acc.name, statedNormal: isTrue ? acc.normal : (acc.normal==='debit'?'kredit':'debit'), isTrue };
        this.renderContent();
      },
      gameTantangan_ans(ans) {
        if(ans === state.games.tantangan.currentQ.isTrue) state.games.tantangan.score += 5;
        else state.games.tantangan.score -= 2;
        this.gameTantangan_next();
      },

      evalAns(idx) {
        if(state.eval.feedback) return;
        state.eval.selected = idx;
        const correct = EVALUASI_QS[state.eval.step].ans === idx;
        if(correct) { state.eval.score+=10; state.eval.feedback='correct'; } else state.eval.feedback='wrong';
        this.renderContent();
        setTimeout(() => {
          state.eval.feedback = null; state.eval.selected = null;
          if(state.eval.step + 1 < EVALUASI_QS.length) state.eval.step++;
          else { state.eval.finished = true; if(state.eval.score>0) this.addPoints(state.eval.score, 'Evaluasi Akhir'); }
          this.renderContent();
        }, 1500);
      },
      evalReset() { state.eval = {step:0,score:0,finished:false,selected:null,feedback:null}; this.renderContent(); },

      // --- AI CHATBOX ---
      chatbox: { isOpen: false, loading: false, messages: [{ role: 'model', text: 'Halo! Saya Tutor AI Akunteraktif. Ada pertanyaan tentang akuntansi yang bisa saya bantu?' }] },
      
      toggleChatbox() {
        this.chatbox.isOpen = !this.chatbox.isOpen;
        this.renderChatbox();
      },

      async sendAI(e) {
        e.preventDefault();
        const inp = document.getElementById('ai-inp');
        const text = inp.value.trim();
        if(!text) return;
        this.chatbox.messages.push({role: 'user', text});
        inp.value = '';
        this.chatbox.loading = true;
        this.renderChatbox();

        try {
          const apiKey = ""; // Disuplai otomatis via Canvas Gemini
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text }] }], systemInstruction: { parts: [{ text: "Kamu adalah tutor akuntansi yang interaktif, ramah dan ringkas untuk SMA." }] } })
          });
          const data = await res.json();
          this.chatbox.messages.push({role: 'model', text: data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, saya tidak paham." });
        } catch (e) {
          this.chatbox.messages.push({role: 'model', text: "Ups, terjadi kesalahan koneksi jaringan." });
        }
        this.chatbox.loading = false;
        this.renderChatbox();
      },

      renderChatbox() {
        const root = document.getElementById('chatbox-root');
        if(!state.user) { root.innerHTML = ''; return; }
        
        root.innerHTML = `
          <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
            ${this.chatbox.isOpen ? `
              <div class="bg-white w-[350px] md:w-[400px] h-[450px] rounded-2xl shadow-2xl border flex flex-col overflow-hidden mb-4 animate-slide-up">
                <div class="bg-indigo-600 p-4 text-white flex justify-between items-center shadow-md z-10">
                  <div class="font-bold flex items-center gap-2"><i class="fas fa-robot text-xl"></i> Tutor AI</div>
                  <button onclick="app.toggleChatbox()" class="text-indigo-200 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div id="cb-msgs" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                  ${this.chatbox.messages.map(m => `
                    <div class="flex ${m.role==='user'?'justify-end':'justify-start'}">
                      <div class="max-w-[85%] p-3 rounded-2xl text-sm leading-relaxed ${m.role==='user'?'bg-indigo-600 text-white rounded-br-sm':'bg-white border text-slate-700 rounded-bl-sm shadow-sm'}">${m.text.replace(/\n/g, '<br/>')}</div>
                    </div>
                  `).join('')}
                  ${this.chatbox.loading ? `<div class="flex justify-start"><div class="bg-white border text-slate-500 p-3 rounded-2xl rounded-bl-sm text-sm italic animate-pulse-fast"><i class="fas fa-circle-notch fa-spin"></i> Mengetik...</div></div>`:''}
                </div>
                <form onsubmit="app.sendAI(event)" class="p-3 bg-white border-t flex gap-2">
                  <input type="text" id="ai-inp" placeholder="Tanya soal akuntansi..." class="flex-1 px-4 py-2 bg-slate-100 border-transparent rounded-xl text-sm outline-indigo-500" ${this.chatbox.loading?'disabled':''}>
                  <button type="submit" class="p-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 disabled:opacity-50" ${this.chatbox.loading?'disabled':''}><i class="fas fa-paper-plane"></i></button>
                </form>
              </div>
            ` : ''}
            <button onclick="app.toggleChatbox()" class="w-14 h-14 rounded-full flex items-center justify-center text-white shadow-xl transition-all duration-300 hover:scale-110 ${this.chatbox.isOpen ? 'bg-red-500' : 'bg-indigo-600 hover:bg-indigo-700'}">
              <i class="fas ${this.chatbox.isOpen ? 'fa-times' : 'fa-comments'} text-2xl"></i>
            </button>
          </div>
        `;
        if(this.chatbox.isOpen) {
           const el = document.getElementById('cb-msgs');
           if(el) el.scrollTop = el.scrollHeight;
        }
      }
    };

    // --- 5. INITIALIZE ---
    window.onload = () => app.init();
  </script>
</body>
</html>
